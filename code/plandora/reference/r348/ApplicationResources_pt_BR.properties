notification.replicate.help=Este agente \u00e9 capaz de ler os dados de uma consulta e replic\u00e1-los em uma tabela destino mesmo que seja em um banco de dados externo. Utilize os campos de drive, url, usuario e senha para definir a base de dados destino. Utilize os campos de SQL para definir os SQLs de entrada e sa\u00edda. Para o SQL de sa\u00edda, utilize o caracter '?' para definir a posi\u00e7\u00e3o dos valores, por exemplo 'insert into tabela (a, b) values (?, ?)'. \u00c9 poss\u00edvel tamb\u00e9m definir se antes da inclus\u00e3o, o sistema deve apagar todo o conte\u00fado da tabela destino. Se o banco destino foi configurado para acesso SEM_SENHA use o caracter '!' no campo 'Usu\u00e1rio BD destino'.   
