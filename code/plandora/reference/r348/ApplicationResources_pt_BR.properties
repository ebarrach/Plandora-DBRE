validate.formMetaField.calendarDomainInvalid=Para o tipo de GUI Calend\u00e1rio, o formato do campo de Dom\u00ednio deve ser: Tamanho(campo num\u00e9rico)|status habilit.(TRUE/FALSE)|Valor Default|Mascara para salvamento do dado. Ex.: '10|TRUE|23/05/2009|yyyyMMdd'. <br>Nota1: A exibi\u00e7\u00e3o da data se basear\u00e1 na configura\u00e7\u00e3o de idioma do browser. <br>Nota2: Use a palavra-chave 'NOW' no valor default para exibir a data corrente.<br>
validate.formMetaField.gridDomainInvalid=Para Grids, o formato do campo de Dom\u00ednio deve ser: &lt;grid border="true" newrow="true" width="60%"&gt;&lt;header&gt;&lt;title&gt;T\u00edtulo&lt;/title&gt;&lt;/header&gt;&lt;row&gt;&lt;col type="1"&gt;10|TRUE|abc&lt;/col&gt;&lt;/row&gt;&lt;/grid&gt;. <br>Nota1: Dentro da tag &lt;col&gt; coloque o dom\u00ednio de acordo com os outros componentes visuais de meta-campo dispon\u00edveis. <br>Nota2: Para o atributo 'type' de &lt;col&gt;: 1=Text Box, 2=Combo Box, 3=SQL Combo Box 4=Text Area e 5=Calend\u00e1rio. <br>Nota3: N\u00e3o \u00e9 permitido colocar um grid dentro de uma c\u00e9lula de &lt;col&gt;.<br>Nota4: Opcionalmente, utilize &lt;?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?&gt; antes de &lt;grid&gt; caso existam caracteres acentuados ou especiais.<br>Nota5: As tags devem ser criadas utilizando caixa baixa.<br>
