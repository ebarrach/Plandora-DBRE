notification.file2table.type=Tipo
notification.file2table.sep=Separador
notification.file2table.help=Este agente copia os dados de um arquivo para uma tabela em um banco de dados. <li>Voc\u00ea precisa definir a estrutura da tabela (nomes dos campos e tipos) e tamb\u00e9m definir a string de conex\u00e3o para acessar a tabela de destino.</li> <li>Tanto a lista com os tipos quanto o nome dos campos devem estar separados por ";". </li><li>Os tipos s\u00e3o expressos em valores inteiros podendo assumir os seguintes valores: 12=varchar, 4=Integer, 8=Double e 93=Timestamp.</li><li>Para tipos Timestamp \u00e9 necess\u00e1rio colocar um parametro adicional com a m\u00e1scara do formato de data. Por exemplo: 12; 12; 93,yyyMMdd HH:mm:ss, 4</li><li>Se a string de conex\u00e3o for a pr\u00f3pria base do Plandora defina o campo com o valor "LOCAL", caso contr\u00e1rio, use o formato [driver | uri | usuario | senha] por exemplo: "com.mysql.jdbc.Driver | jdbc:mysql://server:3306/mydb | user | pass"</li><li>Apenas os inserts est\u00e3o dentro de uma transa\u00e7\u00e3o do banco. Se algo falhar durante o processo, o delete j\u00e1 ter\u00e1 sido executado.</li><li>O campo separador, define o caracter que ser\u00e1 utilizado para "quebrar" uma linha do arquivo em tokens a serem inseridos na base. Use o valor ";" caso voc\u00ea esteja lendo um arquivo csv.</li><li>Tome cuidado ao usar este agente! O mau uso pode acarretar perda de dados.</li>
notification.file2table.debug=Debug ligado?
