notification.execute.help=* Este agente \u00e9 capaz de executar qualquer comando SQL na base do Plandora ou qualquer outra base de dados. <b>ATEN\u00c7\u00c3O</b>: Tome cuidado ao usar este canal de envio pois n\u00e3o h\u00e1 nenhum tipo de filtro para comandos perigosos como por exemplo delete's, drop's, etc. Ap\u00f3s a execu\u00e7\u00e3o, ser\u00e1 gerado uma linha de log na base de dados do Plandora (tabela event_log) com o 'sum\u00e1rio' e 'usu\u00e1rio' configurados nos campos acima.
notification.http.url=URL
notification.http.help=* Utilize o campo URL para definir o endere\u00e7o http de destino. Caso queira atribuir valores din&acirc;micos &agrave; URL utilize as palavras-chave <i>#COL_1#</i>, <i>#COL_2#</i>, <i>#COL_N#</i>, etc para referenciar as colunas da query utilizada na notifica&ccedil;&atilde;o.
notification.checkFile.type=Tipo
notification.engine.type=Engine
notification.checkFile.path=Caminho
notification.checkFile.rule=Regra
notification.checkFile.value=Valor
notification.checkFile.help=* Utilize o campo 'Tipo' para definir a origem do arquivo (HTTP ou FILE). O campo 'caminho' define a localiza\u00e7\u00e3o do arquivo a ser analisado (ex.: \\\\server\\pasta\\arquivo.txt ou http://server/arquivo.txt). Os campos 'regra' e 'valor' definem qual a regra a ser aplicada sobre o arquivo. Ao aplicar a regra, caso retorne VERDADEIRO, uma linha de log ser\u00e1 incluida na base de dados (tabela event_log). As regras s\u00e3o as seguintes: FIND_CONTENT (utilize esta regra para encontrar uma determinada string dentro do arquivo - case-INsensitive); NOT_FIND_CONTENT (esta regra verifica se uma determinada string n\u00e3o existe dentro do arquivo - case-INsensitive); SIZE_GREATER_THAN (verifica se o tamanho do arquivo \u00e9 maior do que um valor); SIZE_SMALLER_THAN (verifica se o tamanho do arquivo \u00e9 menor do que um valor); SIZE_EQUAL (verifica se o tamanho do arquivo \u00e9 igual a um valor). No campo 'valor' pode-se usar opcionalmente a palavra-chave "#DATE|dd/MM/yyyy#" para que o agente converta dinamicamente para o valor da data corrente usando a mascara definida (neste caso dd/MM/yyyy).
notification.newTask.help=* Utilize os campos para especificar os atributos da tarefa que ser\u00e1 criada caso a consulta SQL retorne algum valor. Utilize as palavras-chave <i>#COL_1#</i>, <i>#COL_2#</i>, <i>#COL_N#</i>, etc, para atributir valores din\u00e2micos aos campos. Importante: Lembre-se que cada linha retornada pela consulta SQL se converter\u00e1 em uma nova tarefa. Caso n\u00e3o queira relacionar a nova tarefa a uma solicita\u00e7\u00e3o utilize o valor 'N/A' no campo 'ID da Solicita\u00e7\u00e3o'      
